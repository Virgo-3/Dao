<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8edf3">
  <title>Dao Narrative · Writing room</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/dao.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/static/dao.ico" type="image/vnd.microsoft.icon">
  <script src="/static/app.js" defer></script>
</head>
<body class="narrative">
  <svg class="heading-effects" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="dao-light-heading" x="-5%" y="-10%" width="110%" height="120%" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="erode" radius="1" result="trimmed-strokes"/>
        <feComposite in="SourceAlpha" in2="trimmed-strokes" operator="arithmetic" k2="0.65" k3="0.35" result="light-strokes"/>
        <feComposite in="SourceGraphic" in2="light-strokes" operator="in"/>
      </filter>
    </defs>
  </svg>
  <div id="app-shell" class="app-shell tools-open">
    <header class="app-header">
      <a class="brand" href="/" aria-label="Dao Narrative home"><img class="dao-mark" src="/static/dao.svg" alt="" aria-hidden="true"><span class="brand-label"><span class="brand-name">Dao</span><small class="edition-label">Narrative</small></span></a>
      <div class="header-actions">
        <span id="provider-badge" class="badge"><span class="status-dot"></span>Connecting</span>
        <button id="export-button" class="quiet-button" aria-label="Export story" disabled>Export</button>
        <button id="tools-toggle" class="secondary-button tools-toggle" aria-controls="workspace-tools" aria-expanded="true">Hide panel</button>
      </div>
    </header>
    <div id="global-alert" class="global-alert" role="alert" hidden><span id="alert-message"></span><button id="alert-close" class="icon-button" aria-label="Dismiss error">×</button></div>

    <aside class="sidebar" aria-label="Story drafts">
      <label class="field-label" for="branch-select">Current draft</label>
      <div class="select-wrap"><select id="branch-select" aria-label="Current draft" disabled><option>Loading…</option></select><span aria-hidden="true">⌄</span></div>
      <div class="branch-creator"><input id="branch-name" maxlength="64" placeholder="Name your draft" aria-label="New draft name" data-mutation><button id="create-branch" class="secondary-button" title="Create another draft from this saved version" data-mutation>New draft</button></div>

      <details id="history-details" class="history-section" open>
        <summary class="sidebar-section-title">Versions <span id="history-count" class="count">0</span></summary>
        <ol id="history-list" class="history-list"><li class="muted loading-copy">Loading versions…</li></ol>
      </details>
    </aside>

    <main class="conversation-panel">
      <h1 class="sr-only">Writing room</h1>
      <p id="provider-description" class="mode-note">Opening your writing room…</p>
      <div id="messages" class="messages" aria-label="Writing conversation" aria-live="polite" aria-relevant="additions">
        <section class="empty-state"><img class="empty-emblem" src="/static/dao.svg" alt="" aria-hidden="true"><h2>Where next?</h2></section>
      </div>
      <div id="starter-prompts" class="starter-prompts"><button class="prompt-chip" data-prompt="Help me develop a scene by exploring its character goals, conflict, and possible turns." data-mutation><span>◷</span> Explore a scene</button><button class="prompt-chip" data-prompt="Help me explore two alternate endings, keeping the characters consistent and unresolved questions visible." data-mutation><span>⑂</span> Try another ending</button></div>
      <form id="chat-form" class="composer"><label class="sr-only" for="message-input">Your message</label><textarea id="message-input" rows="2" maxlength="8192" placeholder="Bring a scene, character, or idea…" data-mutation></textarea><div class="composer-bottom"><button id="send-button" class="send-button" type="submit" aria-label="Send message" data-mutation><span id="send-label">Send</span><span aria-hidden="true">↑</span></button></div></form>
      <footer class="conversation-footer"><span id="revision-label">Your versions are saved</span><span>Enter to send · Shift + Enter for a new line</span></footer>
    </main>

    <aside id="workspace-tools" class="inspector" aria-label="Notes and documents">
      <div class="tabs" role="tablist" aria-label="Writing tools">
        <button id="documents-tab" role="tab" aria-controls="documents-panel" aria-selected="true" tabindex="0" data-panel="documents-panel">Documents</button>
        <button id="notes-tab" role="tab" aria-controls="notes-panel" aria-selected="false" tabindex="-1" data-panel="notes-panel">Story notes</button>
        <button id="usage-tab" role="tab" aria-controls="usage-panel" aria-selected="false" tabindex="-1" data-panel="usage-panel">Usage</button>
      </div>
      <section id="documents-panel" role="tabpanel" aria-labelledby="documents-tab" class="tool-panel">
        <div class="section-label"><span>Saved documents</span><button id="document-new" class="text-button" data-mutation>New document</button></div>
        <div id="document-list" class="event-list"></div>
        <label class="field-label spaced" for="document-name">Document name</label>
        <input id="document-name" class="wide-input" value="scene.md" maxlength="100" data-mutation>
        <label class="field-label spaced" for="document-content">Your writing</label>
        <textarea id="document-content" rows="16" maxlength="32768" placeholder="Write or paste a scene…" data-mutation></textarea>
        <button id="document-save" class="primary-button full-width" data-mutation>Save document</button>
        <button id="document-download" class="secondary-button full-width" data-mutation>Download document</button>
        <p id="document-status" class="field-help" role="status"></p>
      </section>
      <section id="notes-panel" role="tabpanel" aria-labelledby="notes-tab" class="tool-panel" hidden>
        <div id="note-list" class="event-list"></div>
        <label class="field-label spaced" for="memory-key">Note name</label>
        <input id="memory-key" class="wide-input" placeholder="e.g. Mara’s motive" maxlength="100" data-mutation>
        <label class="field-label spaced" for="memory-value">Story detail</label>
        <textarea id="memory-value" rows="6" maxlength="4000" data-mutation></textarea>
        <button id="memory-save" class="primary-button full-width" data-mutation>Save note</button>
      </section>
      <section id="usage-panel" role="tabpanel" aria-labelledby="usage-tab" class="tool-panel" hidden>
        <p id="usage-summary"></p><p id="usage-cost" class="field-help"></p>
      </section>
    </aside>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
