[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dao-agent"
version = "0.1.0"
description = "A terminal decision agent with branchable state and the option to wait."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dao = "dao.__main__:main"

[tool.setuptools.packages.find]
include = ["dao*"]
