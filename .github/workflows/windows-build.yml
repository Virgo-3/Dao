name: Windows executable

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'dao/**'
      - 'dao_narrative/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - 'README.md'
      - 'docs/windows.md'
      - '.github/workflows/windows-build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - app: dao
            name: Dao
          - app: narrative
            name: DaoNarrative
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install pinned executable builder
        run: python -m pip install pyinstaller==6.22.3
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python scripts/build_windows.py --app ${{ matrix.app }} --output-dir dist/windows/${{ matrix.name }}
      - name: Smoke test terminal executable
        run: python scripts/smoke_windows.py dist/windows/${{ matrix.name }}/${{ matrix.name }}.exe --app ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-windows-x64
          path: |
            dist/windows/${{ matrix.name }}/${{ matrix.name }}.exe
            dist/windows/${{ matrix.name }}/${{ matrix.name }}.exe.sha256
            dist/windows/${{ matrix.name }}/SHA256SUMS
            dist/windows/${{ matrix.name }}/LICENSE
            dist/windows/${{ matrix.name }}/README.txt
            dist/windows/${{ matrix.name }}/${{ matrix.name }}-windows-x64-*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-windows-x64'
          path: release-assets
      - name: Publish tagged Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-Location release-assets
          $packageArchives = @(Get-ChildItem -LiteralPath . -Filter '*-windows-x64-*.zip' -Recurse)
          $executables = @(Get-ChildItem -LiteralPath . -Filter '*.exe' -Recurse)
          $checksums = @(Get-ChildItem -LiteralPath . -Filter '*.exe.sha256' -Recurse)
          if ($packageArchives.Count -ne 2 -or $executables.Count -ne 2 -or $checksums.Count -ne 2) { throw 'Expected two application packages, executables, and checksums.' }
          $releaseAssets = @($packageArchives.FullName) + @($executables.FullName) + @($checksums.FullName)
          gh release create $env:GITHUB_REF_NAME @releaseAssets --verify-tag --repo $env:GITHUB_REPOSITORY --title "Dao $env:GITHUB_REF_NAME" --notes "Separate Dao and Dao Narrative Windows x64 apps, each with terminal and browser interfaces and its own default data folder. Both start with the offline demo; live AI uses process environment settings."
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
